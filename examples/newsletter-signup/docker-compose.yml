services:
  newsletter:
    image: newsletter-signup:template
    ports:
      - "${NEWSLETTER_PORT:-3100}:3000"
    environment:
      SIGNUP_DATA_DIR: /app/data
    volumes:
      - newsletter-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  newsletter-data:
